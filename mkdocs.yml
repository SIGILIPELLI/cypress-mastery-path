site_name: Cypress Mastery Path
site_description: A free Cypress testing course — real DOM querying, auto-waiting, network stubbing with cy.intercept, custom commands, component testing, and CI integration.
site_url: https://sigilipelli.github.io/cypress-mastery-path/
repo_url: https://github.com/sigilipelli/cypress-mastery-path
repo_name: cypress-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Cypress Fundamentals":
      - Overview: level-1/index.md
      - "01 · What Cypress Actually Is": level-1/01-what-cypress-actually-is.md
      - "02 · Installing & Configuring Cypress": level-1/02-installing-configuring.md
      - "03 · Querying the DOM: cy.get, cy.contains, cy.find": level-1/03-querying-the-dom.md
      - "04 · Interacting With Elements: Type, Click, Check": level-1/04-interacting-with-elements.md
      - "05 · Assertions & should()": level-1/05-assertions.md
      - "06 · Auto-Waiting & Retry-Ability": level-1/06-auto-waiting-retry-ability.md
      - "07 · Forms & Dropdowns": level-1/07-forms-dropdowns.md
      - "08 · Navigation: visit, reload, go": level-1/08-navigation.md
      - "09 · The Cypress App & Headless Mode": level-1/09-cypress-app-headless-mode.md
      - "10 · Project — a Real Login Flow Test": level-1/10-project-login-flow-test.md
  - "Level 2 · Intermediate Patterns":
